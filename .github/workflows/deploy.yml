# =============================================================================
# DO Manager — Cloudflare Workers Deploy Workflow
# =============================================================================
# Before first run, set GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  — CF API token with Workers_scripts:write permission
#   CLOUDFLARE_ACCOUNT_ID — Your Cloudflare account ID
# =============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Authenticate with Cloudflare using GitHub Secrets
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # frontend/ has its own package-lock.json — install separately
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Typecheck
        run: npm run typecheck

      # wrangler deploy does NOT apply D1 migrations automatically —
      # apply them explicitly so a fresh database gets the full schema.
      - name: Apply D1 migrations (production)
        run: npx wrangler d1 migrations apply do-manager-db --remote

      - name: Deploy Worker to Cloudflare
        id: deploy
        run: |
          # Capture output so we can extract the real workers.dev URL
          # (the subdomain is NOT the account ID — hardcoding it caused
          # smoke-test failures in CI).
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 | tr -d '\r')
          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
          if [ -z "$URL" ]; then
            echo "::error::Could not determine workers.dev URL from deploy output"
            exit 1
          fi

      - name: Smoke test — verify Worker is healthy
        run: |
          URL="${{ steps.deploy.outputs.deploy_url }}"
          echo "Checking $URL/api/health ..."
          curl -f --retry 3 --retry-delay 5 --max-time 10 "$URL/api/health"

      - name: Auto-rollback on smoke test failure
        if: failure()
        run: |
          echo "Smoke test failed — rolling back to previous version..."
          npx wrangler rollback
          echo "Rollback complete."

